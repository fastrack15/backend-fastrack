services:
  defect-backend:
    build:
      context: .
      dockerfile: Dockerfile

    pull_policy: build

    container_name: defect-backend
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3000

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

      UPLOADS_DIR: /opt/n8n/uploads

    volumes:
      - /opt/n8n/uploads:/opt/n8n/uploads:ro

    ports:
      - "3001:3000"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - n8n_default

networks:
  n8n_default:
    external: true
    name: n8n_default
